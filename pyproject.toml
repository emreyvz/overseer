[project]
name = "overseer"
version = "0.1.0"
description = "Real-time camera surveillance command center with detection, tracking, forensic search and an AI assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26,<3",
    "ultralytics>=8.4.102,<9",
    "torch>=2.5",
    "torchvision>=0.20",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "psutil>=6.0",
    "requests>=2.32",
    "nvidia-ml-py>=12.0",
    "lapx>=0.5.5",
    "matplotlib>=3.11.1",
    "reportlab>=5.0.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.7.4",
    # Spatial 3D scene view (Feature 4): monocular depth via Depth Anything V2. Core so the view
    # works out of the box; the model weights themselves fetch lazily from the Hugging Face hub
    # on first use (the view degrades to "unavailable" if that fetch can't happen, e.g. offline).
    "transformers>=4.44",
    "timm>=1.0",
    # Full generative 3D reconstruction (Feature 4 PRO): a diffusion inpainter completes the
    # occluded scene. Heavy + VRAM-gated; the weights fetch lazily on first use.
    "diffusers>=0.27",
    "accelerate>=0.30",
    # Multi-view full-3D (Feature 4, primary): DUSt3R runtime deps. DUSt3R itself is cloned into
    # third_party/dust3r (scripts/setup_dust3r) — it's not on PyPI. These are its light extras;
    # core so `uv sync` keeps them. Pure PyTorch, no CUDA build. Weights fetch lazily.
    "roma>=1.5",
    "einops>=0.8",
    "trimesh>=4.0",
]

[project.optional-dependencies]
# Appearance-search model backends. Optional: the match engine runs without them
# (deterministic baseline / DINOv2 fallback). Weights themselves are fetched by
# `python -m match.tools.export_models`, not pip. ANPR needs easyocr; dedicated person
# ReID needs torchreid (plus ReID-trained weights) — see that module's docstring.
ai-extras = [
    "easyocr>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
