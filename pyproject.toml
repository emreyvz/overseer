[project]
name = "overseer"
version = "0.1.0"
description = "Real-time camera surveillance command center with detection, tracking, forensic search and an AI assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26,<3",
    "ultralytics>=8.4.102,<9",
    "torch>=2.5",
    "torchvision>=0.20",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "psutil>=6.0",
    "requests>=2.32",
    "nvidia-ml-py>=12.0",
    "lapx>=0.5.5",
    "matplotlib>=3.11.1",
    "reportlab>=5.0.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
