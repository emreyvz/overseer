name: Build & publish desktop apps

# Builds the Overseer desktop app (Electron) for Windows, macOS and Linux, then a single release
# job publishes the installers to the GitHub Release for a pushed v* tag. The matrix jobs only
# BUILD (no per-job publish) so they never race to create the release. The installer is thin: on
# first launch the app sets up the Python backend (uv sync) and downloads the AI models, matched
# to the machine. See web/electron/main.cjs.
#
# macOS signing: the app is always ad-hoc signed (with hardened-runtime entitlements so it can run
# the bundled Python once quarantine is cleared). For NOTARIZED, warning-free downloads (needs an
# Apple Developer ID), add the repo secrets MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID; the package step then signs + notarizes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest builds BOTH arm64 (Apple Silicon) and x64 (Intel) in one job (see the
        # package step), avoiding the scarce/deprecated macos-13 Intel runners.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv (bundled into the app)
        uses: astral-sh/setup-uv@v4

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assemble backend + uv into resources
        shell: bash
        run: |
          set -e
          mkdir -p web/resources/backend web/resources/bin
          git archive --format=tar HEAD | tar -x -C web/resources/backend
          rm -rf web/resources/backend/website web/resources/backend/demo \
                 web/resources/backend/.github web/resources/backend/web/src \
                 web/resources/backend/web/node_modules web/resources/backend/web/dist
          mkdir -p web/resources/backend/web
          cp -r web/dist web/resources/backend/web/dist
          uvbin="$(command -v uv || true)"
          if [ -n "$uvbin" ]; then cp "$uvbin" web/resources/bin/ 2>/dev/null || cp "${uvbin}.exe" web/resources/bin/ 2>/dev/null || true; fi
          ls -la web/resources/bin || true

      - name: Package (electron-builder, no publish)
        working-directory: web
        shell: bash
        env:
          # macOS: set these repo secrets to get NOTARIZED, warning-free builds (an Apple Developer
          # ID is required). Without them the mac app is ad-hoc signed and, because it is not
          # notarized, macOS marks the downloaded app "damaged" until quarantine is cleared with
          # `xattr -cr /Applications/Overseer.app` (see the release notes / README).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # On macOS build both architectures from the one (arm64) runner.
          ARCH=""
          if [ "$RUNNER_OS" = "macOS" ]; then ARCH="--mac --arm64 --x64"; fi
          # With a Developer ID cert -> turn on hardened runtime (required to notarize; the
          # entitlements at build/entitlements.mac.plist are then auto-detected). Without one ->
          # ad-hoc sign with hardened runtime OFF, so the app still runs the bundled Python after
          # the user clears quarantine (xattr -cr). arm64 needs a signature to run at all.
          EXTRA=""
          if [ -n "$CSC_LINK" ]; then
            EXTRA="-c.mac.hardenedRuntime=true"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          VER=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"; fi
          npx electron-builder --publish never $ARCH $EXTRA $VER

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            web/release/*.exe
            web/release/*.dmg
            web/release/*.zip
            web/release/*.AppImage
            web/release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Overseer ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: false
          files: dist/*
