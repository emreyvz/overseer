name: Build & publish desktop apps

# Builds the Overseer desktop app (Electron) for Windows and Linux, then a single release job
# publishes the installers to the GitHub Release for a pushed v* tag. The matrix jobs only
# BUILD (no per-job publish) so they never race to create the release. The installer is thin: on
# first launch the app sets up the Python backend (uv sync) and downloads the AI models, matched
# to the machine. See web/electron/main.cjs.
#
# No macOS installer is published. Without Apple notarization (a paid Developer ID) Gatekeeper
# tells everyone who downloads a .dmg that the app "is damaged", which reads as a broken download
# rather than a policy block, so Mac users build it themselves instead: see
# website/src/docs/building.md. Everything the app does is supported on macOS and the `mac` target
# in web/package.json is kept so a local `electron-builder --mac` still works; only the prebuilt
# download is gone. If a Developer ID is ever bought, restore the macos-latest matrix entry and the
# signing/notarization env from git history (they were removed in v0.12.15).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv (bundled into the app)
        uses: astral-sh/setup-uv@v4

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assemble backend + uv into resources
        shell: bash
        run: |
          set -e
          mkdir -p web/resources/backend web/resources/bin
          git archive --format=tar HEAD | tar -x -C web/resources/backend
          rm -rf web/resources/backend/website web/resources/backend/demo \
                 web/resources/backend/.github web/resources/backend/web/src \
                 web/resources/backend/web/node_modules web/resources/backend/web/dist
          mkdir -p web/resources/backend/web
          cp -r web/dist web/resources/backend/web/dist
          uvbin="$(command -v uv || true)"
          if [ -n "$uvbin" ]; then cp "$uvbin" web/resources/bin/ 2>/dev/null || cp "${uvbin}.exe" web/resources/bin/ 2>/dev/null || true; fi
          ls -la web/resources/bin || true

      - name: Package (electron-builder, no publish)
        working-directory: web
        shell: bash
        run: |
          VER=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"; fi
          npx electron-builder --publish never $VER

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            web/release/*.exe
            web/release/*.AppImage
            web/release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Overseer ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: false
          files: dist/*
