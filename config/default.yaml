app:
  log_level: INFO
  log_dir: logs
  data_dir: data

camera:
  connect_timeout: 10.0
  read_timeout: 10.0
  reconnect_min_delay: 1.0
  reconnect_max_delay: 60.0
  buffer_size: 5
  freeze_timeout: 10.0

# YouTube (yt-dlp) sources are downloaded once and looped like a live camera.
media:
  max_height: 1080              # cap downloaded video resolution (quality vs size/decode)
  max_concurrent_downloads: 1   # serialize downloads so navigating cameras doesn't storm the box

# Per-camera map preview relays kept warm in parallel.
thumbs:
  max_workers: 24           # raise if you run more cameras than this on the map at once

# Background roster: fills the ROSTER page from ALL cameras (not just the active one),
# deduplicated by appearance embedding, using its own lightweight detector.
roster:
  enabled: true
  detector: yolo11n.pt      # separate from the analysis model so it never races it
  # Recall floor for the background harvester. Lowered so vehicles/people the strong live
  # model sees are also captured into the roster (the light yolo11n scores lower on the same
  # crop); the ReID dedup + min-area snapshot gate keep low-confidence noise out. For maximum
  # recall on a GPU with headroom, set detector: yolo11s.pt (same model as the live pass).
  confidence: 0.25
  imgsz: 960
  interval: 4.0             # seconds to cycle through every camera once
  dedup_threshold: 0.82     # ReID cosine above which two sightings are the same identity
  fullres_interval: 25.0    # passive cameras: seconds between one-shot FULL-RES grabs (0 = off,
                            # thumbnail only). Catches distant subjects on cameras you're not
                            # actively viewing, without straining the system.
  clips: true               # capture a short sighting clip (once per subject) for the dossier
  clip_frames: 16           # frames grabbed for that clip
  clip_fps: 10.0            # playback fps of the sighting clip
  watch_cooldown: 45.0      # BOLO: seconds between repeat alerts for the same watched subject
  # Automatic identity merge (Balanced): after each full camera sweep the harvester folds the
  # very-confident duplicate pairs on its own — same plate, or appearance cosine >= threshold.
  # Safety rails always apply: pairs marked NOT SAME are never merged, and two entries seen on
  # DIFFERENT cameras at the SAME time are never merged (can't be in two places at once). The
  # uncertain band (dedup_threshold down to the merge-center floor) still waits for manual review.
  auto_merge:
    enabled: true
    threshold: 0.85         # appearance cosine at/above which a merge happens unattended

detectors:
  motion:
    enabled: true
    min_area: 500
    event_threshold_percent: 0.5
  yolo:
    model: yolo11s.pt
    confidence: 0.25
    person_confidence: 0.18   # lower floor for PEOPLE only (sitting / swimming / awkward
                              # poses score low); other classes stay at `confidence` so this
                              # doesn't turn clutter into false vehicles/objects
    frame_interval: 2
    imgsz: 1280
    # Sliced inference for distant/low-quality footage (hotel-lobby style scenes where
    # half the people are tiny). 0/1 = off. 2 = 2x2 tiles, 3 = 3x3 — recovers small-object
    # recall WITHOUT lowering confidence, at the cost of slice^2 extra inferences/frame.
    slice: 0
    slice_overlap: 0.2
  person:
    enabled: true
  vehicle:
    enabled: true
  animal:
    enabled: true
  accessory:
    enabled: true
  weapon:
    enabled: true

events:
  throttle_seconds: 10.0
  snapshot_on_event: true

analyzers:
  frame_interval: 2
  daynight:
    enabled: true
    night_below: 50.0
    day_above: 70.0
  fog:
    enabled: true
    contrast_ref: 50.0
    edge_ref: 0.05
    sharpness_ref: 300.0
    onset: 0.6
    clear: 0.3
  rain:
    enabled: true
    diff_threshold: 25
    onset: 0.5
    clear: 0.3
    min_onset_seconds: 3.0
  wind:
    enabled: true
    max_flow: 6.0
    strong: 0.5
  weather:
    enabled: true
    fog_high: 0.6
    rain_high: 0.5
    wind_high: 0.5
    cloud_high: 0.5
    min_dwell_seconds: 30.0
  lightning:
    enabled: true
    spike_delta: 40.0
    spike_ratio: 1.5
    refractory_seconds: 2.0
  meteor:
    enabled: true
    diff_threshold: 40
    min_elongation: 3.0
    min_area: 8
    max_area: 400
  satellite:
    enabled: true
    diff_threshold: 30
    min_track_length: 6
    min_speed: 0.5
    max_speed: 8.0
    max_direction_std_deg: 15.0
  tampering:
    enabled: true
    defocus_sharpness: 60.0
    defocus_clear: 120.0
    obstruction_contrast: 8.0
    obstruction_clear: 16.0
    move_mad: 45.0
    move_frames: 3

recording:
  mode: event
  dir: data/recordings
  fps: 15
  pre_roll_seconds: 5.0
  post_roll_seconds: 5.0
  segment_seconds: 300
  max_buffer_mb: 512
  codecs: [mp4v, XVID, MJPG]
timelapse:
  enabled: true
  dir: data/timelapse
  sample_interval_seconds: 10.0
  fps: 30
  max_segment_seconds: 21600
heatmap:
  decay: 0.98
  width: 240
  alpha: 0.5
retention:
  enabled: true
  interval_hours: 1.0
  max_age_days: 30
  max_total_gb: 20.0
statistics:
  enabled: true
  rollup_interval_hours: 6.0
  export_dir: data/exports
zones:
  loiter_seconds: 30.0    # dwell threshold before a LOITERING event (per-zone override in DB)
  expire_seconds: 5.0     # drop a track's zone state after this many seconds unseen
  tailgate_seconds: 2.0   # crossing by a different track within this window -> TAILGATING
  queue_min: 3            # queue-zone occupancy threshold for a QUEUE event
trajectory:
  enabled: true
  buffer_size: 30
  expire_seconds: 5.0
  running_speed: 250.0     # px/sec (relative)
  stopped_seconds: 5.0
  stopped_eps: 15.0
  uturn_window: 12
  uturn_angle: 150.0
# Rough per-vehicle speed estimate shown on the live overlay. Absolute km/h needs a scene
# scale; without a per-camera calibration meters_per_pixel is a rough default, so the number
# is an ESTIMATE (marked as such in the UI) but stays comparable within one camera.
speed:
  meters_per_pixel: 0.05   # scene scale: metres one pixel spans on the ground plane
  window_seconds: 1.2      # averaging window that smooths frame-to-frame jitter
  ema_alpha: 0.4           # exponential smoothing weight for the newest reading
  min_kmh: 3.0             # below this reads as 0 (stationary) instead of crawling jitter
  max_kmh: 300.0           # above this is treated as track-id reuse and ignored
  still_px: 25.0           # px/s below which a box is "still in frame"; on a moving camera such
                           # a vehicle is keeping pace and borrows the learned camera speed
  # Per-object scale from apparent size: a vehicle's real height (m) ÷ its box height (px)
  # gives metres-per-pixel AT ITS DEPTH, so speed is perspective-correct and roughly metric
  # without any manual per-camera calibration. meters_per_pixel above is only the fallback.
  class_heights:            # real-world heights in metres, by COCO subtype
    car: 1.5
    motorcycle: 1.5
    bus: 3.2
    truck: 3.3
    bicycle: 1.6
  default_height: 1.6
# Camera ego-motion: a moving/dashcam feed drags the whole scene, so vehicle speeds are
# measured relative to the ground by subtracting the camera's own image shift. A fixed camera
# contributes nothing. moving_flow is the median grid-flow (downscaled px) above which the
# camera itself is judged to be moving.
egomotion:
  width: 320               # downscaled width the flow runs on (speed vs sensitivity)
  moving_flow: 1.3
# Vehicle make/brand classification for roster profiles. Runs on CPU in the background
# harvester (off the GPU hot path). Quiet until its weights are present under models/:
#   uv run python -m match.tools.export_models --only carbrand
# Confidence-gated (needs a high top score AND a clear margin) so it never asserts a
# confident-but-wrong brand on buses/trucks/odd crops.
vehicle:
  make:
    model: vehicle_make.torchscript
    min_conf: 0.35          # top-1 probability floor
    min_margin: 0.10        # required lead over the runner-up brand
    min_area: 4096          # skip crops smaller than this (unreliable)
    live_interval: 4.0      # seconds between brand reads per tracked vehicle (live card)
pose:
  enabled: true
  buffer_size: 30
  expire_seconds: 5.0
  standing_aspect: 1.2
  fallen_aspect: 0.8
  crowd_min: 8
  fight_distance: 80.0
  fight_motion: 120.0
objects:
  enabled: true
  buffer_size: 300
  expire_seconds: 30.0
  abandon_seconds: 10.0
  obj_eps: 20.0
  owner_distance: 120.0
  stable_seconds: 3.0
  removed_seconds: 5.0
  # Smart abandoned-object: only alert on luggage a person BROUGHT and then LEFT unattended,
  # so permanently-static fixtures don't spam false positives.
  unattended_seconds: 8.0        # owner must be gone this long before it's "abandoned"
  owner_min_frames: 3            # a person must have genuinely been with it (not just pass by)
  abandon_classes: [backpack, handbag, suitcase]   # luggage only ([] = any accessory)
alerts:
  enabled: true
  cooldown_seconds: 60.0
  crowd_min: 8
  incident_window_minutes: 15
# Investigation cases: an alert can open a Case whose timeline gathers the scene events from
# the log within a window around the incident (seconds before/after the triggering moment).
cases:
  window_before: 90.0
  window_after: 120.0
  clip_frames: 16         # if an alert froze no incident clip, grab this many frames from its
                          # camera when the case opens, so a case always has moving footage
# Smart suggestions: propose an alert rule once a camera has logged a behaviour at least this
# many times (over events.retention_days) without a rule covering it.
suggestions:
  min_events: 5
# Spatial 3D scene view (Feature 4): lift a camera's flat frame into a navigable point cloud
# via monocular depth (Depth Anything V2). The model loads lazily on first request; if its
# weights can't be fetched the view simply reports "unavailable". CUDA inference ~30 ms.
spatial:
  enabled: true
  model: depth-anything/Depth-Anything-V2-Small-hf
  input_width: 640        # frame is resized to this width before depth (quality vs latency)
  grid: 320               # point-cloud grid width sent to the browser (bounds payload size)
  fov_deg: 60.0           # assumed horizontal field of view for back-projection
  detect_conf: 0.3        # confidence floor for the entities placed as 3D markers
# Correlated threat scoring: co-occurring events within window_seconds on one camera are
# fused into a graded threat. Dangerous combinations escalate a firing alert's severity, and
# a high/critical combination with no matching rule is surfaced as its own CORRELATED THREAT
# alert (rate-limited per camera by synth_cooldown_s).
threat:
  window_seconds: 25.0
  synth_cooldown_s: 30.0
anomaly:
  enabled: true
  window_seconds: 60.0
  k: 3.0
  warmup_windows: 8
  min_count: 5
  alpha: 0.15
overseer:
  sound: true
  lens: true
  trails: true
rest_api:
  enabled: false
  host: "127.0.0.1"
  port: 8787
forensic:
  enabled: true
  sample_interval_seconds: 2.0
  expire_seconds: 5.0
  queue_size: 64
  batch_size: 8
  retention_days: 7
  accessory_iou: 0.1
  reid:
    enabled: true
    model: osnet_x0_25.torchscript   # expected file name under models/
    url: null                        # if the operator provides it, ModelManager downloads it
    sha256: null
    input: [256, 128]
  attribute_model:
    enabled: false                   # falls back to classic+COCO until a PAR model is provided
    model: par.torchscript
    labels: [tisort, gomlek, ceket, hoodie, elbise]
  colors:
    palette: default

# Reliable live appearance matching (match/ engine). Replaces the colour-histogram
# visual match. Model paths are relative to models/; when a weight file is absent the
# engine falls back to the deterministic baseline encoder and says so in evidence.
match:
  enabled: true
  detect_conf: 0.25          # YOLO confidence for candidate detection during a search
  window_seconds: 3.0        # rolling window read on a search (live but stable)
  max_frames: 20             # ring-buffer cap per source
  store_max_width: 960       # downscale stored frames to bound memory
  scoring:
    frame_floor: 0.5
    min_temporal_support: 2
    aggregate_percentile: 80.0
    accept_threshold: 0.6
    min_margin: 0.06
  models:
    person_reid: osnet_ain_x1_0.torchscript      # person ReID (OSNet-AIN, cross-domain); missing => DINOv2
    vehicle_reid: veri_sbs_R50-ibn.torchscript    # vehicle ReID (fast-reid VeRi, R50-ibn); missing => DINOv2
    generic: dinov2_vits14.torchscript            # generic object/animal embedding
    seg: yolo11n-seg.pt                            # foreground segmentation (ultralytics)
  reid_input: [256, 128]
  vehicle_input: [256, 256]
  generic_input: [224, 224]
  mask_reid_input: false        # learned ReID trained on unmasked crops; masking is OOD (mask still used for evidence)
  vehicle_builtin_norm: true    # fast-reid models normalize internally (raw [0,255] input); false for torchreid-style
  anpr:
    enabled: true
    langs: [en]
    gpu: true
    min_agreement: 3
    fold_confusable: true
    live_interval: 2.5          # seconds between plate reads per tracked vehicle (live card)
    watch_cooldown: 30.0        # plate watchlist: seconds between repeat alerts for one plate
